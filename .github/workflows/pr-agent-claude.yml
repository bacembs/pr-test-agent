name: PR Agent (Claude)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    name: Run PR Agent with Claude
    permissions:
      contents: read
      pull-requests: write
      issues: write
    if: ${{ github.event.sender.type != 'Bot' }}
    steps:
      - name: Check API Key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ERROR: ANTHROPIC_API_KEY is not set!"
            exit 1
          fi
          echo "API Key is set, length: ${#ANTHROPIC_API_KEY}"
          echo "Key starts with: ${ANTHROPIC_API_KEY:0:20}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_BASE: ${{ secrets.ANTHROPIC_API_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: anthropic/claude-3-5-sonnet-20241022
          config.model_turbo: anthropic/claude-3-5-sonnet-20241022
          config.fallback_models: "['anthropic/claude-3-5-sonnet-20241022']"
          config.pr_reviewer.num_max_findings: 8
          config.pr_code_suggestions.num_code_suggestions_per_chunk: 5
          config.pr_description.auto_describe: true
          config.pr_reviewer.auto_review: true
          config.pr_code_suggestions.auto_improve: true
          config.github_action_config.synchronize_action_allowed: true
